[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "roxy"
dynamic = ["version"]
description = "Protein sequence descriptors for machine learning."
readme = "README.md"
license = "GPL-3.0-only"
requires-python = ">=3.11,<3.15"
authors = [
    { name = "Kren AI Lab", email = "krenai@umag.cl" },
]
keywords = [
    "bioinformatics",
    "descriptors",
    "feature-engineering",
    "machine-learning",
    "proteins",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "numpy>=1.26,<3.0",
    "pandas>=2.0,<3.0",
    "rich>=13.0,<15.0",
    "scikit-learn>=1.3,<2.0",
    "scipy>=1.10,<2.0",
    "typer>=0.9,<1.0",
]

[project.optional-dependencies]
parquet = [
    "fastparquet>=2024.0",
    "pyarrow>=14.0",
]
dev = [
    "ruff>=0.4",
    "taskipy>=1.12",
]
tests = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]
all = [
    "fastparquet>=2024.0",
    "pyarrow>=14.0",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "taskipy>=1.12",
]

[project.scripts]
roxy = "roxy.cli.main:app"

[project.urls]
Homepage = "https://github.com/ProteinEngineering-PESB2/roxy_library"
Repository = "https://github.com/ProteinEngineering-PESB2/roxy_library"
Issues = "https://github.com/ProteinEngineering-PESB2/roxy_library/issues"

[tool.hatch.version]
path = "roxy/__init__.py"
pattern = '__version__ = "(?P<version>[^"]+)"'

[tool.hatch.build.targets.sdist]
include = ["/roxy"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "COM812",
    "D203",
    "D213",
    "N802",
    "N803",
    "N806",
    "PLR0913"
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = [
    "ANN",
    "D",
    "EM101",
    "PLC0415",
    "PLR2004",
    "PT017",
    "S101",
    "TRY003"
]

[tool.taskipy.tasks]
sort-imports = "ruff check --fix --select I,F401 roxy/ tests/"
format = "task sort-imports && ruff format roxy/ tests/"
lint = "ruff check roxy/ tests/"
lint-fix = "ruff check --fix roxy/ tests/"
test = "pytest -q"
test-v = "pytest -v"
test-cov = "pytest --cov=roxy --cov-report=html"

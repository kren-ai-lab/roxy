[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "roxy"
dynamic = ["version"]
description = "Protein sequence descriptors for machine learning."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11,<3.15"
authors = [
    { name = "Kren AI Lab", email = "krenai@umag.cl" },
]
keywords = [
    "bioinformatics",
    "descriptors",
    "feature-engineering",
    "machine-learning",
    "proteins",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "numpy>=2.4,<3.0",
    "polars>=1.40.1",
    "pyyaml>=6.0.3",
    "rich>=15.0,<16.0",
    "scikit-learn>=1.8,<2.0",
    "scipy>=1.17,<2.0",
    "typer>=0.25,<1.0",
]

[project.optional-dependencies]
dev = [
    "pyrefly>=0.64",
    "ruff>=0.15",
    "taskipy>=1.14",
    "ty>=0.0.30"
]
tests = [
    "pytest>=9.0",
    "pytest-cov>=7.1",
]
all = [
    "pyrefly>=1.0.0",
    "pytest>=9.0",
    "pytest-cov>=7.0",
    "ruff>=0.15",
    "taskipy>=1.14",
    "ty>=0.0.30"
]

[project.scripts]
roxy = "roxy.cli.main:app"

[project.urls]
Homepage = "https://github.com/ProteinEngineering-PESB2/roxy_library"
Repository = "https://github.com/ProteinEngineering-PESB2/roxy_library"
Issues = "https://github.com/ProteinEngineering-PESB2/roxy_library/issues"

[tool.hatch.version]
path = "roxy/__init__.py"
pattern = '__version__ = "(?P<version>[^"]+)"'


[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "COM812",
    "D203",
    "D213",
    "N802",
    "N803",
    "N806",
    "PLR0913"
]

[tool.ruff.lint.per-file-ignores]
"roxy/cli/*" = [
    "B008",    # typer.Option() in function defaults is the intended pattern
    "FBT001",  # bool flags are standard in CLI functions
    "FBT002",
    "FBT003",
    "TC003",   # Path used at runtime by typer for type coercion
]
"tests/*" = [
    "ANN",
    "D",
    "EM101",
    "FBT003",
    "PLC0415",
    "PLR2004",
    "PT017",
    "S101",
    "TRY003"
]
"examples/*" = [
    "INP001",  # example scripts are intentionally standalone modules
    "PLR2004", # small referential scripts can compare against literal sizes
    "S101",    # lightweight runtime checks are fine in examples
    "S603",    # subprocess usage is explicit in CLI examples
    "T201",    # examples print result snippets by design
]

[tool.taskipy.tasks]
sort-imports = "ruff check --fix --select I,F401 roxy/ tests/ examples/"
format = "task sort-imports && ruff format roxy/ tests/ examples/"
lint = "ruff check roxy/ tests/ examples/"
lint-fix = "ruff check --fix roxy/ tests/ examples/"
ty = "ty check roxy/ tests/ examples/"
pyrefly = "pyrefly check roxy/ tests/ examples/"
test = "pytest -q"
test-v = "pytest -v"
test-cov = "pytest --cov=roxy --cov-report=html"

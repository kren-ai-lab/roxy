#:schema https://www.schemastore.org/prek.json

exclude = "^.idea/"

[[repos]]
repo = "https://github.com/pre-commit/pre-commit-hooks"
rev = "v6.0.0"
hooks = [
  { id = "check-yaml" },
  { id = "check-toml" },
  { id = "end-of-file-fixer" },
  { id = "trailing-whitespace" }
]

[[repos]]
repo = "local"
hooks = [
  {
    id = "lint",
    name = "lint-check",
    entry = "uv run task lint",
    language = "system",
    pass_filenames = false
  }
]
